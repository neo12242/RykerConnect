import org.jetbrains.kotlin.gradle.dsl.JvmTarget
plugins { alias(libs.plugins.android.application) }
android {
    namespace 'de.chaostheorybot.rykerconnect.watch'
    compileSdk 37
    defaultConfig {
        applicationId 'de.chaostheorybot.rykerconnect'
        minSdk 30
        targetSdk 37
        versionCode 18
        versionName '1.7.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'edition'
    productFlavors {
        companion { dimension 'edition'; manifestPlaceholders = [appLabel: 'Ryker Watch ESP'] }
        phone { dimension 'edition'; applicationIdSuffix '.phone'; manifestPlaceholders = [appLabel: 'Ryker Watch Phone'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17 } }
dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
