import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'de.chaostheorybot.rykerconnect'
    compileSdk 37

    defaultConfig {
        applicationId "de.chaostheorybot.rykerconnect"
        minSdk 31
        targetSdk 37
        versionCode 19
        versionName '1.8.0'
        // Development demonstrations require a deliberate opt-in, even in debug builds.
        buildConfigField 'boolean', 'DEMO_FEATURES', providers.gradleProperty('enableDemos').map { it.toBoolean().toString() }.getOrElse('false')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    flavorDimensions 'edition'
    productFlavors {
        companion {
            dimension 'edition'
            buildConfigField 'boolean', 'PHONE_EDITION', 'false'
            manifestPlaceholders = [appLabel: 'RykerConnect']
        }
        phone {
            dimension 'edition'
            applicationIdSuffix '.phone'
            versionNameSuffix '-phone'
            buildConfigField 'boolean', 'PHONE_EDITION', 'true'
            manifestPlaceholders = [appLabel: 'RykerConnect Phone']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        // drawable-mdpi enthaelt die 40 ryker_*.webp Animationsframes, keine Icons.
        // Vier Dichtevarianten davon wuerden das APK vervielfachen, und der Rahmen
        // begrenzt die Darstellung ohnehin - die Pruefung greift hier ins Leere.
        disable += 'IconMissingDensityFolder'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.maplibre.gl:android-sdk:13.6.1'

    implementation libs.androidx.core.ktx
    implementation platform(libs.kotlin.bom)
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.appcompat.resources
    implementation libs.androidx.media3.session
    testImplementation libs.junit
    testImplementation 'org.json:json:20260814'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.accompanist.drawablepainter
    implementation libs.androidx.navigation.compose
    implementation(libs.androidx.datastore.preferences)
    implementation libs.client
    implementation libs.scanner
    
    // OkHttp direkt eingebunden, um Catalog-Fehler auszuschließen
    implementation libs.okhttp

}
