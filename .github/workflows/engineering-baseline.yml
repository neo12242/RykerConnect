name: Engineering baseline

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: baseline / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check: [android, simulator, firmware, rtc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Java
        if: matrix.check == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Set up Android SDK
        if: matrix.check == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install simulator dependencies
        if: matrix.check == 'simulator'
        run: python -m pip install -r Simulator/requirements.txt
      - name: Install firmware tooling
        if: matrix.check == 'firmware'
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Run existing checks
        run: python scripts/validate.py --only ${{ matrix.check }}
      - name: Keep validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-${{ matrix.check }}-${{ github.sha }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
          path: |
            .validation/**/*.json
            .validation/**/*.log
            Android/app/build/test-results/testDebugUnitTest/*.xml
            Android/app/build/reports/lint-results-debug.*
